action: jump_shot
display_name: 跳投
description: 跳投动作规范评估（站定起跳出手；与罚篮的区别为是否跳起）

phases:
  - name: load
    display_name: 蓄力
    metrics:
      knee_angle:
        joint: left_knee
        min: 105
        max: 135
        weight: 0.20
        unit: deg
        feedback_low: 膝关节弯曲不足，起跳蓄力不够
        feedback_high: 蹲得过低，可能影响起跳节奏
      elbow_angle:
        joint: right_elbow
        min: 70
        max: 95
        weight: 0.10
        unit: deg

  - name: takeoff
    display_name: 起跳
    metrics:
      knee_extension:
        joint: left_knee
        min: 140
        max: 175
        weight: 0.15
        unit: deg
        feedback_low: 起跳伸膝不充分

  - name: release
    display_name: 出手
    metrics:
      wrist_angle:
        joint: right_wrist
        min: 160
        max: 180
        weight: 0.25
        unit: deg
        feedback_low: 出手时手腕压腕不足
      release_height:
        metric: wrist_height_m
        min: 2.1
        max: 2.9
        weight: 0.20
        unit: m

  - name: follow_through
    display_name: 跟随
    metrics:
      wrist_extension:
        metric: wrist_extension_rate
        min: 0.5
        max: 1.0
        weight: 0.05
        unit: ratio
      elbow_drop_delay:
        metric: frames_after_release
        min: 5
        max: 30
        weight: 0.05
        unit: frames

scoring:
  pass_threshold: 60
  excellent_threshold: 85
