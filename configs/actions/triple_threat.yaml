action: triple_threat
display_name: 三威胁
description: 三威胁站姿与突破启动规范

phases:
  - name: stance
    display_name: 威胁站姿
    metrics:
      knee_flexion:
        joint: both_knees_avg
        min: 110
        max: 150
        weight: 0.3
        unit: deg
      ball_position:
        metric: ball_hip_distance_norm
        min: 0.1
        max: 0.4
        weight: 0.2
        unit: ratio

  - name: jab_step
    display_name: 刺探步
    metrics:
      jab_depth:
        metric: lead_foot_forward_m
        min: 0.15
        max: 0.45
        weight: 0.25
        unit: m

  - name: drive_trigger
    display_name: 突破启动
    metrics:
      first_step_speed:
        metric: com_velocity_mps
        min: 1.5
        max: 5.0
        weight: 0.25
        unit: m/s

scoring:
  pass_threshold: 55
  excellent_threshold: 80
